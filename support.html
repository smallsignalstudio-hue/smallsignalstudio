<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Support & Feedback — Small Signal Studio">
    <title>Support | Small Signal Studio</title>
    <link rel="icon" href="./assets/logo-signal-dot.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .support-page {
            max-width: 560px;
            margin: 0 auto;
            padding: 8rem 1.5rem 6rem;
        }
        .support-page header {
            margin-bottom: 2.5rem;
        }
        .support-page header p {
            font-size: 1rem;
            line-height: 1.7;
        }
        .support-form {
            background: var(--clr-surface-light);
            border: 1px solid var(--clr-border);
            border-radius: var(--radius);
            padding: 2rem;
        }
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--clr-surface);
            border: 1px solid var(--clr-border);
            border-radius: var(--radius);
            color: var(--clr-text-main);
            font-family: inherit;
            font-size: 0.95rem;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239A8F84' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 16px;
        }
        select:focus {
            outline: none;
            border-color: rgba(240, 237, 232, 0.3);
        }
        @media (max-width: 768px) {
            .support-form {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <img src="./assets/logo-signal-dot.png" alt="" class="brand-logo-img" width="28" height="28">
                Small Signal Studio
            </a>
            <div class="nav-links">
                <a href="index.html#portfolio">Apps</a>
                <a href="support.html" class="active">Support</a>
            </div>
        </div>
    </nav>

    <main class="support-page">
        <header>
            <span class="badge">Support</span>
            <h1 class="section-title">Get in touch</h1>
            <p>Feedback, questions, or bug reports — we read everything.</p>
        </header>

        <form id="support-form" class="support-form">
            <div class="form-row grid-2-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="app">Application</label>
                <select id="app" required>
                    <option value="" disabled selected>Choose an app…</option>
                    <option value="Sippin">Sippin'</option>
                    <option value="Batten">Batten</option>
                    <option value="TaleSnack">TaleSnack</option>
                    <option value="Glossio">Glossio</option>
                    <option value="General">General / Studio</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Your message…" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Send message</button>
            <div class="form-status" id="form-status"></div>
        </form>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <img src="./assets/logo-signal-dot.png" alt="" width="24" height="24" class="brand-logo-img">
                <span>Small Signal Studio</span>
            </div>
            <div class="footer-links">
                <a href="mailto:hello@smallsignalstudio.com">hello@smallsignalstudio.com</a>
                <a href="index.html">Home</a>
                <a href="privacy-sippin.html">Sippin Privacy</a>
            </div>
        </div>
        <div class="container footer-bottom">
            <p>&copy; 2026 Small Signal Studio. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('support-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button');
            const status = document.getElementById('form-status');
            const originalText = btn.textContent;

            btn.textContent = 'Sending…';
            btn.disabled = true;

            try {
                const feedbacks = JSON.parse(localStorage.getItem('sss_feedbacks') || '[]');
                feedbacks.push({
                    id: 'fb-' + Date.now(),
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    app: document.getElementById('app').value,
                    message: document.getElementById('message').value,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem('sss_feedbacks', JSON.stringify(feedbacks));

                setTimeout(() => {
                    status.textContent = 'Message sent. Thank you.';
                    status.className = 'form-status success';
                    form.reset();
                    btn.textContent = originalText;
                    btn.disabled = false;
                    setTimeout(() => { status.style.display = 'none'; }, 5000);
                }, 800);
            } catch (err) {
                btn.textContent = originalText;
                btn.disabled = false;
                status.textContent = 'Something went wrong. Please try again.';
                status.className = 'form-status error';
            }
        });
    </script>
</body>
</html>
