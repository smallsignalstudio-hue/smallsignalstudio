spring:
  application:
    name: pricing-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/pricing
    username: pricing
    password: pricing
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

pricing:
  quote-ttl: 15m
